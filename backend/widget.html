<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Consenso+ Chat</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body,html{margin:0;padding:0;height:100%;font-family:Inter,system-ui,sans-serif;color:#0B1324;background:#F7F9FC;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
.wrap{display:flex;flex-direction:column;height:100%;max-width:440px;margin:0 auto;background:#fff;border:1px solid #E5EAF2;overflow:hidden}
@supports(height:100dvh){.wrap{height:100dvh}}
:root{
  --vv-h:100%;
  --brand:#0069FE;          /* Primary CTA, user bubble (azul main) */
  --brand-dark:#003F99;     /* Header gradient end */
  --brand-soft:#EAF2FF;     /* Avatar bg, focus ring */
  --brand-border:#C7DDFF;   /* Icebreakers border */
  --bot:#0069FE;            /* Bot accent (links, prices) — overridable per-agent */
  --gold:#E4AC1E;           /* Consenso gold — send button, launcher */
  --gold-dark:#C7951A;      /* Gold hover */
  --gold-soft:#FEF7E0;      /* Gold soft tint */
}
@media(max-width:520px){
  .wrap{max-width:100%;border:0;border-radius:0}
  .hd{padding:14px 14px 16px}
  .msgs{padding:12px 10px}
  .msg{font-size:15px;padding:10px 14px}
  .inp{padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  .inp input{font-size:16px;padding:12px 16px} /* 16px prevents iOS zoom on focus */
  .inp button{width:44px;height:44px} /* touch-friendly */
  .ice button{padding:9px 14px;font-size:14px} /* touch-friendly */
  .card{max-width:100%;margin-left:30px}
  .card-carousel{margin-left:30px}
  .card-carousel.multi .card{flex:0 0 240px}
  .mini{width:24px;height:24px;font-size:9px}
  .ice{margin-left:30px}
  .typing{margin-left:30px}
}
.hd{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-dark) 100%);color:#fff;padding:18px 18px 22px;display:flex;align-items:center;gap:12px;position:relative}
.hd::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 90% 10%,rgba(255,255,255,.15) 1px,transparent 1px);background-size:24px 24px;pointer-events:none}
.av{width:44px;height:44px;border-radius:50%;background:var(--brand-soft);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--brand);font-weight:700;font-size:16px;position:relative;border:2px solid rgba(255,255,255,.3);z-index:1}
.av-inner{width:100%;height:100%;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av .dot{position:absolute;bottom:0;right:0;width:12px;height:12px;background:#22c55e;border-radius:50%;box-shadow:0 0 0 2px #004db3;z-index:2;pointer-events:none}
.hd .info{z-index:1;flex:1;min-width:0}
.hd .close-btn{display:none;background:rgba(255,255,255,.15);border:0;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;align-items:center;justify-content:center;z-index:2;transition:background .15s;font-size:20px;font-weight:300;padding:0;line-height:1}
.hd .close-btn:hover{background:rgba(255,255,255,.25)}
@media(max-width:520px){.hd .close-btn{display:flex}}
.hd .name{font-weight:600;font-size:15px;line-height:1.2}
.hd .st{font-size:11px;opacity:.92;display:flex;align-items:center;gap:4px;margin-top:3px}
.hd .st::before{content:"";width:6px;height:6px;background:#7CFFA3;border-radius:50%;animation:p 1.5s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.5}}
.msgs{flex:1;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:12px;background:#F7F9FC}
.row{display:flex;gap:8px;align-items:flex-end}
.row.me{flex-direction:row-reverse}
.mini{width:26px;height:26px;border-radius:50%;flex-shrink:0;background:var(--brand-soft);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--brand);position:relative}
.mini img{width:100%;height:100%;object-fit:cover;display:block}
.mini::after,.mini::before{content:none!important;display:none!important}
.row.me .mini{visibility:hidden}
.row{animation:slideIn .28s ease-out both}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg{max-width:78%;padding:11px 15px;border-radius:22px;font-size:14px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;box-shadow:0 1px 2px rgba(11,19,36,.04)}
.me .msg{background:var(--brand);color:#fff;border-bottom-right-radius:6px}
.bot .msg{background:#fff;border:1px solid #E5EAF2;color:#0B1324;border-bottom-left-radius:6px}
.row.continuation{margin-top:-6px}
.row.continuation.bot .mini{visibility:hidden}
.row.continuation.bot .msg{border-top-left-radius:12px}
.ice{display:flex;flex-wrap:wrap;gap:6px;margin-left:34px;margin-top:2px}
.ice button{background:#fff;border:1px solid var(--brand-border);color:var(--brand);padding:7px 13px;border-radius:999px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.ice button:hover{background:#EAF2FF;transform:translateY(-1px)}
.card-carousel{display:flex;flex-direction:column;gap:10px;margin-left:34px;margin-top:6px}
.card-carousel.multi{flex-direction:row;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin-right:-14px;scrollbar-width:thin}
.card-carousel.multi::-webkit-scrollbar{height:4px}
.card-carousel.multi::-webkit-scrollbar-thumb{background:#C7D0DF;border-radius:2px}
.card-carousel.multi .card{flex:0 0 280px;scroll-snap-align:start;margin:0}
.card{border:1px solid #E5EAF2;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 4px 16px rgba(11,19,36,.06);max-width:320px;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;animation:slideIn .35s ease-out both}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(11,19,36,.14)}
.card .imgwrap{position:relative;width:100%;height:200px;background:linear-gradient(135deg,#EAF2FF 0%,#C7DDFF 100%);overflow:hidden}
.card .imgwrap.noimg::before{content:"🏠";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:48px;filter:grayscale(.3) opacity(.55)}
.card .imgwrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.card:hover .imgwrap img{transform:scale(1.06)}
.card .tag{position:absolute;top:11px;left:11px;background:rgba(11,19,36,.86);backdrop-filter:blur(8px);color:#fff;padding:5px 11px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.02em;box-shadow:0 2px 8px rgba(11,19,36,.18)}
.card .badge-typ{position:absolute;top:11px;right:11px;background:var(--bot);color:#fff;padding:4px 10px;border-radius:6px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 2px 6px rgba(11,19,36,.18)}
.card .b{padding:14px 15px 12px}
.card .t{font-weight:700;font-size:15px;line-height:1.3;color:#0B1324;letter-spacing:-.01em}
.card .loc{font-size:12px;color:#5B6B82;margin-top:4px;display:flex;align-items:center;gap:4px}
.card .loc::before{content:"📍";font-size:11px}
.card .p{color:var(--bot);font-size:16px;font-weight:800;margin-top:10px;letter-spacing:-.015em}
.card .d{font-size:12.5px;color:#5B6B82;margin-top:6px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .features{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.card .features span{background:#F4F7FB;color:#5B6B82;padding:3px 8px;border-radius:6px;font-size:10.5px;font-weight:500;border:1px solid #EEF1F7}
.card a.detail{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;text-align:center;background:#fff;color:var(--user);text-decoration:none;font-size:13px;font-weight:600;transition:background .15s;border-top:1px solid #EEF1F7}
.card a.detail:hover{background:#F4F7FB}
.card .actions{display:flex;border-top:1px solid #EEF1F7}
.card .actions a, .card .actions button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:11px 8px;text-align:center;font-size:12.5px;font-weight:600;text-decoration:none;border:0;cursor:pointer;background:#fff;color:var(--user);transition:background .15s;font-family:inherit}
.card .actions a:hover{background:#F4F7FB}
.card .actions button.book{background:var(--user);color:#fff}
.card .actions button.book:hover{filter:brightness(.92)}
.card .actions a + button{border-left:1px solid #EEF1F7}
.card .badge-ext{position:absolute;bottom:11px;left:11px;background:rgba(228,172,30,.95);color:#fff;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 2px 6px rgba(11,19,36,.18)}
.finance-card{background:linear-gradient(135deg,#fff 0%,#F4F7FB 100%);max-width:320px}
.finance-card .b{padding:18px 18px 16px}
.finance-card .t{font-size:15px;color:#0B1324;font-weight:700;margin-bottom:14px;letter-spacing:-.01em}
.finance-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-bottom:14px}
.finance-grid .fg-row{display:flex;flex-direction:column;font-size:12px}
.finance-grid .fg-row span{color:#5B6B82;font-weight:500;margin-bottom:2px}
.finance-grid .fg-row b{color:#0B1324;font-weight:700;font-size:13px}
.finance-highlight{background:var(--brand);color:#fff;border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 14px rgba(0,105,254,.22)}
.finance-highlight span{font-size:12px;opacity:.9;font-weight:500}
.finance-highlight strong{font-size:18px;font-weight:800;letter-spacing:-.02em}
.finance-note{font-size:10.5px;color:#8593A8;margin-top:10px;font-style:italic;text-align:center}
.finance-compare{margin-top:14px;padding:12px;background:#F4F7FB;border-radius:12px;border:1px dashed #C7DDFF}
.finance-compare .fc-title{font-size:12px;font-weight:700;color:#0B1324;margin-bottom:10px;display:flex;align-items:center;gap:5px}
.finance-compare .fc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.finance-compare .fc-col{background:#fff;padding:9px 10px;border-radius:8px;border:1px solid #E5EAF2}
.finance-compare .fc-lbl{font-size:10.5px;color:#5B6B82;font-weight:500;margin-bottom:3px}
.finance-compare .fc-val{font-size:13px;font-weight:700;color:#0B1324;letter-spacing:-.01em}
.finance-compare .fc-diff{font-size:10.5px;font-weight:600;margin-top:4px;padding:2px 6px;border-radius:5px;display:inline-block}
.finance-compare .fc-diff.up{color:#B91C1C;background:#FEE2E2}
.finance-compare .fc-diff.down{color:#15803D;background:#DCFCE7}

/* Visit booking modal */
.cp-modal-bg{position:absolute;inset:0;background:rgba(11,19,36,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.cp-modal{background:#fff;border-radius:20px;padding:22px 22px 20px;width:88%;max-width:340px;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:slideUp .25s cubic-bezier(.2,.8,.2,1)}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.cp-modal h3{margin:0 0 4px;font-size:17px;color:#0B1324;font-weight:700;letter-spacing:-.01em}
.cp-modal .sub{color:#5B6B82;font-size:12.5px;margin-bottom:14px;line-height:1.4}
.cp-modal .prop{background:#F4F7FB;border-radius:10px;padding:9px 11px;font-size:12px;color:#0B1324;margin-bottom:14px;font-weight:600}
.cp-modal label{display:block;font-size:11.5px;color:#5B6B82;margin:8px 0 4px;font-weight:600}
.cp-modal input{width:100%;padding:9px 11px;border:1px solid #E5EAF2;border-radius:10px;font-size:13px;font-family:inherit;outline:none;transition:border-color .15s;box-sizing:border-box;background:#fff;color:#0B1324}
.cp-modal input:focus{border-color:var(--user)}
.cp-modal .row{display:flex;gap:8px}
.cp-modal .row > div{flex:1}
.cp-modal .btn-row{display:flex;gap:8px;margin-top:16px}
.cp-modal button.confirm{flex:1;background:var(--user);color:#fff;border:0;padding:11px;border-radius:10px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;transition:filter .15s}
.cp-modal button.confirm:hover{filter:brightness(.92)}
.cp-modal button.confirm:disabled{opacity:.6;cursor:not-allowed}
.cp-modal button.cancel{background:#F4F7FB;color:#0B1324;border:0;padding:11px 14px;border-radius:10px;font-weight:600;font-size:13.5px;cursor:pointer;font-family:inherit;transition:background .15s}
.cp-modal button.cancel:hover{background:#EEF1F7}
.cp-modal .err{color:#DC2626;font-size:11.5px;margin-top:8px;min-height:14px}
.inp{display:flex;gap:8px;padding:12px;border-top:1px solid #E5EAF2;background:#fff}
.inp input{flex:1;padding:11px 16px;border:1px solid #E5EAF2;border-radius:999px;font:inherit;outline:none;font-size:14px;transition:all .15s}
.inp input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.inp button{background:var(--gold);color:#fff;border:0;width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;box-shadow:0 3px 10px rgba(228,172,30,.32)}
.inp button:hover{background:var(--gold-dark);transform:scale(1.05);box-shadow:0 4px 14px rgba(228,172,30,.45)}
.inp button:disabled{opacity:.5}
.typing{margin-left:34px;display:inline-flex;gap:4px;padding:12px 16px;background:#fff;border:1px solid #E5EAF2;border-radius:20px;align-self:flex-start;animation:slideIn .2s ease-out both}
.typing span{width:7px;height:7px;border-radius:50%;background:#C7D0DF;animation:t 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes t{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.footer{font-size:10px;color:#9AA4B6;text-align:center;padding:6px;background:#fff}
.footer a{color:inherit;text-decoration:none;cursor:pointer;display:inline-block}
.footer a:hover{text-decoration:underline}
.footer a .brand{color:var(--brand)}
</style>
</head>

let LANG = "pt";          // active language (set by loadAgent from agent.language)
let T = I18N.pt;          // active i18n table (shortcut)

function applyLanguage(lang) {
  LANG = (lang && I18N[lang]) ? lang : "en";
  T = I18N[LANG] || I18N.en;
  document.documentElement.lang = LANG;
  // Update DOM strings that already exist at load time
  try { t.placeholder = T.placeholder; } catch (e) {}
  try { t.setAttribute("aria-label", T.messageAria); } catch (e) {}
  try { document.getElementById("closeBtn").setAttribute("aria-label", T.closeAria); } catch (e) {}
  try { document.getElementById("sendBtn").setAttribute("aria-label", T.sendAria); } catch (e) {}
}

function initials(s) { return (s || "A").trim().slice(0, 2).toUpperCase(); }

function miniAvatar() {
  const mini = document.createElement("div");
  mini.className = "mini";

  return mini;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[c]));
}

function formatBotText(raw) {
  // Light markdown rendering for bot bubbles:
  // 1) escape HTML, 2) auto-link URLs, 3) keep • bullets, 4) normalize \n
  // Removes literal "\•" (backslash bullet) glitch sometimes emitted by LLMs.
  if (!raw) return "";
  let t = String(raw);
  // Strip "\•" glitch (literal backslash before bullet)
  t = t.replace(/\\•/g, "\n•").replace(/\\\s*•/g, "\n•");
  // Strip leading \n at bullets
  t = t.replace(/\\n/g, "\n");
  t = escapeHtml(t);
  // Auto-link URLs (after escape so we re-construct anchors)
  t = t.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer" style="color:var(--brand);text-decoration:underline">$1</a>');
  // Bold via **x**
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  // Newlines → <br>
  t = t.replace(/\n/g, "<br>");
  return t;
}

async function postWithRetry(url, payload, attempts) {
  attempts = attempts || 2;
  let lastErr;
  for (let i = 0; i <= attempts; i++) {
    try {
      const r = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    } catch (e) {
      lastErr = e;
      if (i < attempts) await new Promise(r => setTimeout(r, 500 * (i + 1)));
    }
  }
  throw lastErr;
}

    + '<label>' + T.fldEmail + '</label>'

    + '<label>' + T.fldPhone + '</label>'
    + '<input type="tel" id="bk-phone" autocomplete="tel" placeholder="' + T.phPhone + '">'
    + '<div class="row">'
    +   '<div><label>' + T.fldDate + '</label><input type="date" id="bk-date" min="' + minDate + '"></div>'
    +   '<div><label>' + T.fldTime + '</label><input type="time" id="bk-time" value="11:00"></div>'
    + '</div>'
    + '<div class="err" id="bk-err"></div>'
    + '<div class="btn-row">'
    +   '<button class="cancel" type="button" id="bk-cancel">' + T.btnCancel + '</button>'
    +   '<button class="confirm" type="button" id="bk-confirm">' + T.btnConfirm + '</button>'
    + '</div>'
    + '</div>';
  document.body.appendChild(bg);
  const nameI = bg.querySelector("#bk-name");
  const emailI = bg.querySelector("#bk-email");
  const phoneI = bg.querySelector("#bk-phone");
  const dateI = bg.querySelector("#bk-date");
  const timeI = bg.querySelector("#bk-time");
  const errEl = bg.querySelector("#bk-err");
  const cancel = bg.querySelector("#bk-cancel");
  const confirm = bg.querySelector("#bk-confirm");
  // Prefill name if widget already knows it
  if (NAME_V) nameI.value = NAME_V;
  dateI.value = minDate;
  nameI.focus();
  const close = () => bg.remove();
  cancel.addEventListener("click", close);
  bg.addEventListener("click", (e) => { if (e.target === bg) close(); });
  document.addEventListener("keydown", function onEsc(e) {
    if (e.key === "Escape") { close(); document.removeEventListener("keydown", onEsc); }
  });
  const validateEmail = (s) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
  confirm.addEventListener("click", async () => {
    errEl.textContent = "";
    const name = (nameI.value || "").trim();
    const email = (emailI.value || "").trim();
    const phone = (phoneI.value || "").trim();
    const date = (dateI.value || "").trim();
    const time = (timeI.value || "").trim();
    if (!name || name.length < 2) return errEl.textContent = T.errName;
    if (!validateEmail(email)) return errEl.textContent = T.errEmail;
    if (!date) return errEl.textContent = T.errDate;
    confirm.disabled = true; confirm.textContent = T.btnConfirming;
    try {
      const j = await postWithRetry(API + "/webchat/" + TENANT + "/book-visit", {
        name: name, email: email, phone: phone, date: date, time: time,
        property_title: propertyTitle || "", property_link: propertyLink || "",
        external_user_id: UID, agent_id: AGENT_ID || null,
      });
      close();
      // Show celebratory message in chat
      botMsg(j.message_pt || (T.visitBookedFor + " " + date + (time ? " " + T.visitAt + " " + time : "") + "."), [], [], { continuation: true });
      NAME_V = name; // remember
    } catch (err) {
      errEl.textContent = T.errVisitFail;
      confirm.disabled = false; confirm.textContent = T.btnConfirm;
    }
  });
}

let SENDING = false;   // anti double-submit lock

async function send(text) {
  if (!text) return;
  if (SENDING) return;  // already processing a message; ignore double submit
  SENDING = true;
  try { document.getElementById("sendBtn").disabled = true; t.disabled = true; } catch (e) {}
  meMsg(text);
  const typing = document.createElement("div");
  typing.className = "typing";
  typing.innerHTML = "<span></span><span></span><span></span>";
  msgs.appendChild(typing);
  msgs.scrollTop = msgs.scrollHeight;

  // Try streaming first (SSE). Falls back to /message if browser/network blocks it.
  let streamed = false;
  try {
    const res = await fetch(API + "/webchat/" + TENANT + "/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "text/event-stream" },
      body: JSON.stringify({
        channel: "webchat", external_user_id: UID, contact_name: NAME_V,
        text: text, agent_id: AGENT_ID || null, page_context: PAGE_CONTEXT || null,
      }),
    });
    if (!res.ok || !res.body) throw new Error("HTTP " + res.status);

    streamed = true;
    let row = null, bubble = null, accReply = "", finalCards = [], finalFollow = null;
    // Adaptive typing — drains chars at human-like cadence.
    // Calibrated to feel like reading someone TYPING (not skimming a paste).
    //   Slow typist ~30 WPM = ~30 chars/s
    //   Natural    ~40 WPM = ~40 chars/s
    //   Fast       ~60 WPM = ~55 chars/s
    let pendingChars = [];
    let renderedText = "";
    let streamDone = false;
    let typingTimer = null;

    const startTypingTimer = () => {
      if (typingTimer) return;
      const tick = () => {
        if (pendingChars.length === 0) {
          if (streamDone) {
            typingTimer = null;
            return;
          }
          typingTimer = setTimeout(tick, 50);
          return;
        }
        // Adaptive delay per char — NO batching, always 1 char per tick for natural feel.
        // Short replies (<40 chars expected): deliberate pace ~50ms/char = 20 c/s
        // Medium (40-160): natural typing      ~30ms/char = 33 c/s
        // Long (>=160): brisk reading pace     ~18ms/char = 55 c/s
        const expectedTotal = renderedText.length + pendingChars.length;
        let delay;
        if (expectedTotal >= 160) delay = 18;
        else if (expectedTotal >= 40) delay = 30;
        else delay = 50;
        // Micro-jitter (±15%) so it doesn't feel like a metronome
        delay = delay * (0.85 + Math.random() * 0.3);
        // Slight pause after punctuation — adds rhythm
        const lastChar = renderedText[renderedText.length - 1];
        if (lastChar === "." || lastChar === "!" || lastChar === "?") delay += 120;
        else if (lastChar === ",") delay += 50;
        // Catch-up safety net — if backend is way ahead, drain a tiny bit faster
        // but NEVER skip chars / batch (keeps it natural)
        if (pendingChars.length > 200) delay = Math.max(10, delay * 0.55);
        const ch = pendingChars.shift();
        renderedText += ch;
        if (bubble) {
          // Renderiza com markdown leve só quando há quebras ou bullets para evitar
          // overhead em cada tick. Caso contrário usa textContent para o efeito de typing.
          if (renderedText.indexOf("\n") >= 0 || renderedText.indexOf("•") >= 0 || renderedText.indexOf("http") >= 0 || renderedText.indexOf("\\•") >= 0) {
            bubble.innerHTML = formatBotText(renderedText);
          } else {
            bubble.textContent = renderedText;
          }
          msgs.scrollTop = msgs.scrollHeight;
        }
        typingTimer = setTimeout(tick, delay);
      };
      typingTimer = setTimeout(tick, 50);
    };

    const reader = res.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buf = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const ev = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 2);
        if (!ev.startsWith("data:")) continue;
        let evt;
        try { evt = JSON.parse(ev.slice(5).trim()); } catch (_) { continue; }
        if (evt.type === "chunk") {
          if (!bubble) {
            typing.remove();
            row = document.createElement("div");
            row.className = "row bot";
            row.appendChild(miniAvatar());
            bubble = document.createElement("div");
            bubble.className = "msg bot";
            row.appendChild(bubble);
            msgs.appendChild(row);
          }
          accReply += evt.text;
          // Push chars into the typing queue (not directly into the DOM)
          for (const ch of evt.text) pendingChars.push(ch);
          startTypingTimer();
        } else if (evt.type === "done") {
          finalCards = evt.cards || [];
          finalFollow = evt.follow_up || null;
          if (!bubble) {
            // No chunks were emitted (happens on tiny replies) — just render
            typing.remove();
            botMsg(evt.reply || "…", [], []);
            streamDone = true;
          } else {
            // Ensure any divergence between streamed chars and final reply is reconciled
            const finalReply = evt.reply || accReply;
            // Push any remaining chars (in case JSON-final had escape divergence)
            for (let i = renderedText.length + pendingChars.length; i < finalReply.length; i++) {
              pendingChars.push(finalReply[i]);
            }
            streamDone = true;
            startTypingTimer();
          }
        } else if (evt.type === "error") {
          throw new Error(evt.error || "stream error");
        }
      }
    }

    // Wait until the typing queue drains before showing follow-up
    while (pendingChars.length > 0) await new Promise(r => setTimeout(r, 50));

    // Render follow-up + cards (typing dots between for natural feel)
    if (finalFollow || finalCards.length > 0) {
      const typing2 = document.createElement("div");
      typing2.className = "typing";
      typing2.innerHTML = "<span></span><span></span><span></span>";
      msgs.appendChild(typing2);
      msgs.scrollTop = msgs.scrollHeight;
      await new Promise(r => setTimeout(r, 600));
      typing2.remove();
      botMsg(finalFollow || "", [], finalCards, { continuation: true });
    }
  } catch (err) {
    // Fallback to non-streaming endpoint
    if (!streamed) {
      try {
        const j = await postWithRetry(API + "/webchat/" + TENANT + "/message", {
          channel: "webchat", external_user_id: UID, contact_name: NAME_V,
          text: text, agent_id: AGENT_ID || null, page_context: PAGE_CONTEXT || null,
        });
        typing.remove();
        botMsg(j.reply || "…", [], []);
        if (j.follow_up || (j.cards && j.cards.length > 0)) {
          const typing2 = document.createElement("div");
          typing2.className = "typing";
          typing2.innerHTML = "<span></span><span></span><span></span>";
          msgs.appendChild(typing2);
          msgs.scrollTop = msgs.scrollHeight;
          await new Promise(r => setTimeout(r, 900));
          typing2.remove();
          botMsg(j.follow_up || "", [], j.cards || [], { continuation: true });
        }
        return;
      } catch (_) { /* fall through to error message */ }
    }
    typing.remove();
    botMsg("⚠️ Problema de ligação. A tentar novamente assim que possível.", [], []);
    // Auto-retry APENAS quando estamos offline e recuperamos rede.
    // Não fazemos setTimeout(send) para evitar pilha de retries em cascata
    // quando o endpoint devolve HTTP 5xx repetidamente.
    if (!navigator.onLine) {
      window.addEventListener("online", () => {
        if (!SENDING) send(text);
      }, { once: true });
    }
  } finally {
    SENDING = false;
    try { document.getElementById("sendBtn").disabled = false; t.disabled = false; t.focus(); } catch (e) {}
  }
}

async function loadAgent() {
  const url = API + "/public/agent/" + TENANT + (AGENT_ID ? "?agent_id=" + AGENT_ID : "");
  let j = null;
  for (let i = 0; i < 3 && !j; i++) {
    try {
      const r = await fetch(url);
      if (r.ok) j = await r.json();
    } catch { /* retry */ }
    if (!j) await new Promise(r => setTimeout(r, 500 * (i + 1)));
  }
  if (!j) {
    avInnerEl.textContent = "A";
    botMsg(T.connecting, [], []);
    setTimeout(loadAgent, 5000);
    return;
  }
  agent = j;
  // Apply per-agent language FIRST so subsequent UI strings use it
  applyLanguage(j.language || "pt");
  // Apply per-agent theme overrides (CSS variables) — supports .primary and .bot
  if (j.theme && typeof j.theme === "object") {
    const root = document.documentElement.style;
    if (j.theme.primary) root.setProperty("--brand", j.theme.primary);
    if (j.theme.primary_dark) root.setProperty("--brand-dark", j.theme.primary_dark);
    if (j.theme.primary_soft) root.setProperty("--brand-soft", j.theme.primary_soft);
    if (j.theme.primary_border) root.setProperty("--brand-border", j.theme.primary_border);
    if (j.theme.bot) root.setProperty("--bot", j.theme.bot);
  }
  nameEl.textContent = j.name || "Assistente";
  document.title = (j.name || "Chat") + " · " + (j.tenant_name || "Consenso+");
  if (j.avatar_url) {
    avInnerEl.innerHTML = "";
    const img = document.createElement("img");
    img.src = j.avatar_url;
    img.onerror = () => { avInnerEl.textContent = initials(j.name); };
    avInnerEl.appendChild(img);
  } else {
    avInnerEl.textContent = initials(j.name);
  }
  botMsg(j.welcome_message || T.defaultWelcome, j.icebreakers || [], []);
}

f.addEventListener("submit", e => {
  e.preventDefault();
  const v = t.value.trim();
  if (!v) return;
  t.value = "";
  send(v);
});
loadAgent();

// Close button — posts message to parent or goes back
document.getElementById("closeBtn").addEventListener("click", () => {
  try {
    if (window.parent !== window) window.parent.postMessage({ type: "cp-close" }, "*");
    else window.history.length > 1 ? window.history.back() : window.close();
  } catch (e) { /* ignore */ }
});

// iOS visual viewport — adjust for keyboard so the input stays visible
if (window.visualViewport) {
  const root = document.documentElement;
  const adjust = () => {
    root.style.setProperty("--vv-h", window.visualViewport.height + "px");
    msgs.scrollTop = msgs.scrollHeight;
  };
  window.visualViewport.addEventListener("resize", adjust);
  window.visualViewport.addEventListener("scroll", adjust);
}
</script>
</body>
