<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Consenso+ Chat</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body,html{margin:0;padding:0;height:100%;font-family:Inter,system-ui,sans-serif;color:#0B1324;background:#F7F9FC}
.wrap{display:flex;flex-direction:column;height:100%;max-width:440px;margin:0 auto;background:#fff;border:1px solid #E5EAF2;overflow:hidden}
.hd{background:linear-gradient(135deg,#0069FE 0%,#003F99 100%);color:#fff;padding:18px 18px 22px;display:flex;align-items:center;gap:12px;position:relative}
.hd::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 90% 10%,rgba(255,255,255,.15) 1px,transparent 1px);background-size:24px 24px;pointer-events:none}
.av{width:44px;height:44px;border-radius:50%;background:#EAF2FF;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#0069FE;font-weight:700;font-size:16px;overflow:hidden;position:relative;border:2px solid rgba(255,255,255,.3);z-index:1}
.av img{width:100%;height:100%;object-fit:cover}
.av::after{content:"";position:absolute;bottom:-2px;right:-2px;width:12px;height:12px;background:#22c55e;border-radius:50%;border:2px solid #fff}
.hd .info{z-index:1}
.hd .name{font-weight:600;font-size:15px;line-height:1.2}
.hd .st{font-size:11px;opacity:.92;display:flex;align-items:center;gap:4px;margin-top:3px}
.hd .st::before{content:"";width:6px;height:6px;background:#7CFFA3;border-radius:50%;animation:p 1.5s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.5}}
.msgs{flex:1;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:12px;background:#F7F9FC}
.row{display:flex;gap:8px;align-items:flex-end}
.row.me{flex-direction:row-reverse}
.mini{width:26px;height:26px;border-radius:50%;flex-shrink:0;background:#EAF2FF;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#0069FE}
.mini img{width:100%;height:100%;object-fit:cover}
.row.me .mini{visibility:hidden}
.msg{max-width:78%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.me .msg{background:#0069FE;color:#fff;border-bottom-right-radius:4px}
.bot .msg{background:#fff;border:1px solid #E5EAF2;border-bottom-left-radius:4px}
.ice{display:flex;flex-wrap:wrap;gap:6px;margin-left:34px;margin-top:2px}
.ice button{background:#fff;border:1px solid #C7DDFF;color:#0069FE;padding:7px 12px;border-radius:18px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.ice button:hover{background:#EAF2FF}
.card{border:1px solid #E5EAF2;border-radius:14px;overflow:hidden;background:#fff;margin-left:34px;margin-top:4px;box-shadow:0 1px 3px rgba(0,0,0,.04);max-width:300px}
.card img{width:100%;height:130px;object-fit:cover;background:#EEF2F7;display:block}
.card .b{padding:10px 12px}
.card .t{font-weight:600;font-size:14px;line-height:1.3}
.card .p{color:#0069FE;font-size:14px;font-weight:700;margin-top:3px}
.card .d{font-size:12px;color:#5B6B82;margin-top:5px;line-height:1.4}
.card a{display:block;padding:9px 12px;text-align:center;background:#0069FE;color:#fff;text-decoration:none;font-size:13px;font-weight:600}
.card a:hover{background:#0057D5}
.inp{display:flex;gap:8px;padding:12px;border-top:1px solid #E5EAF2;background:#fff}
.inp input{flex:1;padding:11px 14px;border:1px solid #E5EAF2;border-radius:22px;font:inherit;outline:none;font-size:14px}
.inp input:focus{border-color:#0069FE;box-shadow:0 0 0 3px #EAF2FF}
.inp button{background:#0069FE;color:#fff;border:0;width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.inp button:hover{background:#0057D5}
.inp button:disabled{opacity:.5}
.typing{margin-left:34px;display:inline-flex;gap:4px;padding:10px 14px;background:#fff;border:1px solid #E5EAF2;border-radius:14px;align-self:flex-start}
.typing span{width:7px;height:7px;border-radius:50%;background:#C7D0DF;animation:t 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes t{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.footer{font-size:10px;color:#9AA4B6;text-align:center;padding:6px;background:#fff}
.footer a{color:#0069FE;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <div class="av" id="av">A</div>
    <div class="info">
      <div class="name" id="agentName">Assistente</div>
      <div class="st">Online</div>
    </div>
  </div>
  <div class="msgs" id="msgs"></div>
  <form class="inp" id="f"><input id="t" placeholder="Escrever mensagem..." required aria-label="Mensagem">
    <button aria-label="Enviar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M2 12l20-9-5 19-5-8-10-2z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
    </button>
  </form>
  <div class="footer">Powered by <a href="#" target="_blank">Consenso+</a></div>
</div>
<script>
const params = new URLSearchParams(location.search);
const API = params.get("api") || (location.origin + "/api");
const TENANT = params.get("tenant");
const AGENT_ID = params.get("agent") || "";
const NAME_V = params.get("name") || "Visitante";
const UID = "w-" + Math.random().toString(36).slice(2,10);
const msgs = document.getElementById("msgs");
const f = document.getElementById("f");
const t = document.getElementById("t");
const avEl = document.getElementById("av");
const nameEl = document.getElementById("agentName");
let agent = { name: "Assistente", avatar_url: "", welcome_message: "Olá! Como posso ajudar?", icebreakers: [] };

function initials(s) { return (s || "A").trim().slice(0, 2).toUpperCase(); }

function miniAvatar() {
  const mini = document.createElement("div");
  mini.className = "mini";
  if (agent.avatar_url) {
    const img = document.createElement("img");
    img.src = agent.avatar_url;
    img.onerror = () => { mini.textContent = initials(agent.name); };
    mini.appendChild(img);
  } else {
    mini.textContent = initials(agent.name);
  }
  return mini;
}

function botMsg(text, icebreakers, cards) {
  const row = document.createElement("div");
  row.className = "row bot";
  row.appendChild(miniAvatar());
  const m = document.createElement("div");
  m.className = "msg";
  m.textContent = text;
  row.appendChild(m);
  msgs.appendChild(row);

  (cards || []).forEach(c => {
    const card = document.createElement("div");
    card.className = "card";
    let html = "";
    if (c.image) html += '<img src="' + c.image + '" onerror="this.style.display=\'none\'">';
    html += '<div class="b"><div class="t">' + (c.title || "") + '</div>';
    if (c.price) html += '<div class="p">' + c.price + '</div>';
    if (c.description) html += '<div class="d">' + c.description + '</div>';
    html += '</div>';
    if (c.link) html += '<a href="' + c.link + '" target="_blank" rel="noreferrer">Ver mais →</a>';
    card.innerHTML = html;
    msgs.appendChild(card);
  });

  if (icebreakers && icebreakers.length) {
    const box = document.createElement("div");
    box.className = "ice";
    icebreakers.forEach(q => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = q;
      b.onclick = () => send(q);
      box.appendChild(b);
    });
    msgs.appendChild(box);
  }
  msgs.scrollTop = msgs.scrollHeight;
}

function meMsg(text) {
  const row = document.createElement("div");
  row.className = "row me";
  row.appendChild(miniAvatar());
  const m = document.createElement("div");
  m.className = "msg";
  m.textContent = text;
  row.appendChild(m);
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
}

async function send(text) {
  if (!text) return;
  meMsg(text);
  const typing = document.createElement("div");
  typing.className = "typing";
  typing.innerHTML = "<span></span><span></span><span></span>";
  msgs.appendChild(typing);
  msgs.scrollTop = msgs.scrollHeight;
  try {
    const r = await fetch(API + "/webchat/" + TENANT + "/message", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ channel: "webchat", external_user_id: UID, contact_name: NAME_V, text: text, agent_id: AGENT_ID || null }),
    });
    const j = await r.json();
    typing.remove();
    botMsg(j.reply || "…", [], j.cards || []);
  } catch (err) {
    typing.remove();
    botMsg("Erro de ligação. Por favor tente novamente.", [], []);
  }
}

async function loadAgent() {
  try {
    const url = API + "/public/agent/" + TENANT + (AGENT_ID ? "?agent_id=" + AGENT_ID : "");
    const r = await fetch(url);
    const j = await r.json();
    agent = j;
    nameEl.textContent = j.name || "Assistente";
    document.title = (j.name || "Chat") + " · " + (j.tenant_name || "Consenso+");
    if (j.avatar_url) {
      avEl.innerHTML = "";
      const img = document.createElement("img");
      img.src = j.avatar_url;
      img.onerror = () => { avEl.textContent = initials(j.name); };
      avEl.appendChild(img);
    } else {
      avEl.textContent = initials(j.name);
    }
    botMsg(j.welcome_message || "Olá! Como posso ajudar?", j.icebreakers || [], []);
  } catch (e) {
    avEl.textContent = "A";
    botMsg("Olá! Como posso ajudar?", [], []);
  }
}

f.addEventListener("submit", e => {
  e.preventDefault();
  const v = t.value.trim();
  if (!v) return;
  t.value = "";
  send(v);
});
loadAgent();
</script>
</body>
</html>
