<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Consenso+ Chat</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body,html{margin:0;padding:0;height:100%;font-family:Inter,system-ui,sans-serif;color:#0B1324;background:#F7F9FC;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
.wrap{display:flex;flex-direction:column;height:100%;max-width:440px;margin:0 auto;background:#fff;border:1px solid #E5EAF2;overflow:hidden}
@supports(height:100dvh){.wrap{height:100dvh}}
:root{
  --vv-h:100%;
  --brand:#0069FE;          /* Primary CTA, user bubble, send button */
  --brand-dark:#003F99;     /* Header gradient end */
  --brand-soft:#EAF2FF;     /* Avatar bg, focus ring */
  --brand-border:#C7DDFF;   /* Icebreakers border */
  --bot:#0069FE;            /* Bot accent (links, prices) — overridable per-agent */
}
@media(max-width:520px){
  .wrap{max-width:100%;border:0;border-radius:0}
  .hd{padding:14px 14px 16px}
  .msgs{padding:12px 10px}
  .msg{font-size:15px;padding:10px 14px}
  .inp{padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  .inp input{font-size:16px;padding:12px 16px} /* 16px prevents iOS zoom on focus */
  .inp button{width:44px;height:44px} /* touch-friendly */
  .ice button{padding:9px 14px;font-size:14px} /* touch-friendly */
  .card{max-width:100%;margin-left:30px}
  .card-carousel{margin-left:30px}
  .card-carousel.multi .card{flex:0 0 240px}
  .mini{width:24px;height:24px;font-size:9px}
  .ice{margin-left:30px}
  .typing{margin-left:30px}
}
.hd{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-dark) 100%);color:#fff;padding:18px 18px 22px;display:flex;align-items:center;gap:12px;position:relative}
.hd::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 90% 10%,rgba(255,255,255,.15) 1px,transparent 1px);background-size:24px 24px;pointer-events:none}
.av{width:44px;height:44px;border-radius:50%;background:var(--brand-soft);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--brand);font-weight:700;font-size:16px;position:relative;border:2px solid rgba(255,255,255,.3);z-index:1}
.av-inner{width:100%;height:100%;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av .dot{position:absolute;bottom:0;right:0;width:12px;height:12px;background:#22c55e;border-radius:50%;box-shadow:0 0 0 2px #004db3;z-index:2;pointer-events:none}
.hd .info{z-index:1;flex:1;min-width:0}
.hd .close-btn{display:none;background:rgba(255,255,255,.15);border:0;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;align-items:center;justify-content:center;z-index:2;transition:background .15s;font-size:20px;font-weight:300;padding:0;line-height:1}
.hd .close-btn:hover{background:rgba(255,255,255,.25)}
@media(max-width:520px){.hd .close-btn{display:flex}}
.hd .name{font-weight:600;font-size:15px;line-height:1.2}
.hd .st{font-size:11px;opacity:.92;display:flex;align-items:center;gap:4px;margin-top:3px}
.hd .st::before{content:"";width:6px;height:6px;background:#7CFFA3;border-radius:50%;animation:p 1.5s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.5}}
.msgs{flex:1;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:12px;background:#F7F9FC}
.row{display:flex;gap:8px;align-items:flex-end}
.row.me{flex-direction:row-reverse}
.mini{width:26px;height:26px;border-radius:50%;flex-shrink:0;background:var(--brand-soft);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--brand);position:relative}
.mini img{width:100%;height:100%;object-fit:cover;display:block}
.mini::after,.mini::before{content:none!important;display:none!important}
.row.me .mini{visibility:hidden}
.row{animation:slideIn .28s ease-out both}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg{max-width:78%;padding:11px 15px;border-radius:22px;font-size:14px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;box-shadow:0 1px 2px rgba(11,19,36,.04)}
.me .msg{background:var(--brand);color:#fff;border-bottom-right-radius:6px}
.bot .msg{background:#fff;border:1px solid #E5EAF2;color:#0B1324;border-bottom-left-radius:6px}
.row.continuation{margin-top:-6px}
.row.continuation.bot .mini{visibility:hidden}
.row.continuation.bot .msg{border-top-left-radius:12px}
.ice{display:flex;flex-wrap:wrap;gap:6px;margin-left:34px;margin-top:2px}
.ice button{background:#fff;border:1px solid var(--brand-border);color:var(--brand);padding:7px 13px;border-radius:999px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.ice button:hover{background:#EAF2FF;transform:translateY(-1px)}
.card-carousel{display:flex;flex-direction:column;gap:10px;margin-left:34px;margin-top:6px}
.card-carousel.multi{flex-direction:row;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin-right:-14px;scrollbar-width:thin}
.card-carousel.multi::-webkit-scrollbar{height:4px}
.card-carousel.multi::-webkit-scrollbar-thumb{background:#C7D0DF;border-radius:2px}
.card-carousel.multi .card{flex:0 0 260px;scroll-snap-align:start;margin:0}
.card{border:1px solid #E5EAF2;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 4px 16px rgba(11,19,36,.06);max-width:300px;transition:transform .2s,box-shadow .2s;animation:slideIn .3s ease-out both}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,105,254,.18)}
.card .imgwrap{position:relative;width:100%;height:160px;background:linear-gradient(135deg,#EAF2FF 0%,#C7DDFF 100%);overflow:hidden}
.card .imgwrap.noimg::before{content:"🏠";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;filter:grayscale(.3) opacity(.55)}
.card .imgwrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.card:hover .imgwrap img{transform:scale(1.04)}
.card .tag{position:absolute;top:10px;left:10px;background:rgba(11,19,36,.82);backdrop-filter:blur(8px);color:#fff;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.02em}
.card .b{padding:13px 14px 10px}
.card .t{font-weight:700;font-size:14.5px;line-height:1.3;color:#0B1324;letter-spacing:-.01em}
.card .loc{font-size:12px;color:#5B6B82;margin-top:3px;display:flex;align-items:center;gap:4px}
.card .loc::before{content:"📍";font-size:11px}
.card .p{color:var(--bot);font-size:15px;font-weight:800;margin-top:8px;letter-spacing:-.01em}
.card .d{font-size:12.5px;color:#5B6B82;margin-top:6px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card a{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;text-align:center;background:#0069FE;color:#fff;text-decoration:none;font-size:13px;font-weight:600;transition:background .15s}
.card a:hover{background:#0057D5}
.inp{display:flex;gap:8px;padding:12px;border-top:1px solid #E5EAF2;background:#fff}
.inp input{flex:1;padding:11px 16px;border:1px solid #E5EAF2;border-radius:999px;font:inherit;outline:none;font-size:14px;transition:all .15s}
.inp input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.inp button{background:var(--brand);color:#fff;border:0;width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.inp button:hover{background:#0057D5;transform:scale(1.05)}
.inp button:disabled{opacity:.5}
.typing{margin-left:34px;display:inline-flex;gap:4px;padding:12px 16px;background:#fff;border:1px solid #E5EAF2;border-radius:20px;align-self:flex-start;animation:slideIn .2s ease-out both}
.typing span{width:7px;height:7px;border-radius:50%;background:#C7D0DF;animation:t 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes t{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.footer{font-size:10px;color:#9AA4B6;text-align:center;padding:6px;background:#fff}
.footer a{color:var(--brand);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <div class="av" id="av"><div class="av-inner" id="avInner">A</div><span class="dot" aria-hidden="true"></span></div>
    <div class="info">
      <div class="name" id="agentName">Assistente</div>
      <div class="st">Online</div>
    </div>
    <button class="close-btn" id="closeBtn" aria-label="Fechar" type="button">×</button>
  </div>
  <div class="msgs" id="msgs"></div>
  <form class="inp" id="f"><input id="t" placeholder="Escrever mensagem..." required aria-label="Mensagem">
    <button aria-label="Enviar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M2 12l20-9-5 19-5-8-10-2z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
    </button>
  </form>
  <div class="footer">Powered by <a href="#" target="_blank">Consenso+</a></div>
</div>
<script>
const params = new URLSearchParams(location.search);
const API = params.get("api") || (location.origin + "/api");
const TENANT = params.get("tenant");
const AGENT_ID = params.get("agent") || "";
const NAME_V = params.get("name") || "Visitante";
const UID = "w-" + Math.random().toString(36).slice(2,10);
const msgs = document.getElementById("msgs");
const f = document.getElementById("f");
const t = document.getElementById("t");
const avEl = document.getElementById("av");
const avInnerEl = document.getElementById("avInner");
const nameEl = document.getElementById("agentName");
let agent = { name: "Assistente", avatar_url: "", welcome_message: "Olá! Como posso ajudar?", icebreakers: [] };

function initials(s) { return (s || "A").trim().slice(0, 2).toUpperCase(); }

function miniAvatar() {
  const mini = document.createElement("div");
  mini.className = "mini";
  if (agent.avatar_url) {
    const img = document.createElement("img");
    img.src = agent.avatar_url;
    img.onerror = () => { mini.textContent = initials(agent.name); };
    mini.appendChild(img);
  } else {
    mini.textContent = initials(agent.name);
  }
  return mini;
}

function botMsg(text, icebreakers, cards, opts) {
  opts = opts || {};
  const row = document.createElement("div");
  row.className = "row bot" + (opts.continuation ? " continuation" : "");
  row.appendChild(miniAvatar());
  const m = document.createElement("div");
  m.className = "msg";
  m.textContent = text;
  row.appendChild(m);
  msgs.appendChild(row);

  const allCards = cards || [];
  if (allCards.length > 0) {
    const carousel = document.createElement("div");
    carousel.className = "card-carousel" + (allCards.length >= 2 ? " multi" : "");
    allCards.forEach(c => {
      const card = document.createElement("div");
      card.className = "card";
      const imgHtml = c.image
        ? '<div class="imgwrap"><img src="' + c.image + '" referrerpolicy="no-referrer" loading="lazy" onerror="this.parentElement.classList.add(\'noimg\');this.remove()">' + (c.price ? '<span class="tag">' + c.price + '</span>' : '') + '</div>'
        : '';
      let body = '<div class="b"><div class="t">' + (c.title || "") + '</div>';
      if (c.description && c.description.indexOf("Localização") === -1) {
        const loc = (c.description.match(/([A-Z][a-záãéêíóúçâ]+(?:,\s*[A-Z][a-záãéêíóúçâ]+)?)/) || [])[0];
        if (loc && loc.length < 40) body += '<div class="loc">' + loc + '</div>';
      }
      if (c.price && !c.image) body += '<div class="p">' + c.price + '</div>';
      if (c.description) body += '<div class="d">' + c.description + '</div>';
      body += '</div>';
      const linkHtml = c.link
        ? '<a href="' + c.link + '" target="_blank" rel="noreferrer">Ver detalhes <span style="font-size:14px">→</span></a>'
        : '';
      card.innerHTML = imgHtml + body + linkHtml;
      carousel.appendChild(card);
    });
    msgs.appendChild(carousel);
  }

  if (icebreakers && icebreakers.length) {
    const box = document.createElement("div");
    box.className = "ice";
    icebreakers.forEach(q => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = q;
      b.onclick = () => send(q);
      box.appendChild(b);
    });
    msgs.appendChild(box);
  }
  msgs.scrollTop = msgs.scrollHeight;
}

function meMsg(text) {
  const row = document.createElement("div");
  row.className = "row me";
  row.appendChild(miniAvatar());
  const m = document.createElement("div");
  m.className = "msg";
  m.textContent = text;
  row.appendChild(m);
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
}

async function postWithRetry(url, payload, attempts) {
  attempts = attempts || 2;
  let lastErr;
  for (let i = 0; i <= attempts; i++) {
    try {
      const r = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    } catch (e) {
      lastErr = e;
      if (i < attempts) await new Promise(r => setTimeout(r, 500 * (i + 1)));
    }
  }
  throw lastErr;
}

async function send(text) {
  if (!text) return;
  meMsg(text);
  const typing = document.createElement("div");
  typing.className = "typing";
  typing.innerHTML = "<span></span><span></span><span></span>";
  msgs.appendChild(typing);
  msgs.scrollTop = msgs.scrollHeight;

  // Try streaming first (SSE). Falls back to /message if browser/network blocks it.
  let streamed = false;
  try {
    const res = await fetch(API + "/webchat/" + TENANT + "/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "text/event-stream" },
      body: JSON.stringify({
        channel: "webchat", external_user_id: UID, contact_name: NAME_V,
        text: text, agent_id: AGENT_ID || null,
      }),
    });
    if (!res.ok || !res.body) throw new Error("HTTP " + res.status);

    streamed = true;
    let row = null, bubble = null, accReply = "", finalCards = [], finalFollow = null;
    // Adaptive typing — drains chars at human-like cadence.
    // Calibrated to feel like reading someone TYPING (not skimming a paste).
    //   Slow typist ~30 WPM = ~30 chars/s
    //   Natural    ~40 WPM = ~40 chars/s
    //   Fast       ~60 WPM = ~55 chars/s
    let pendingChars = [];
    let renderedText = "";
    let streamDone = false;
    let typingTimer = null;

    const startTypingTimer = () => {
      if (typingTimer) return;
      const tick = () => {
        if (pendingChars.length === 0) {
          if (streamDone) {
            typingTimer = null;
            return;
          }
          typingTimer = setTimeout(tick, 50);
          return;
        }
        // Adaptive delay per char — NO batching, always 1 char per tick for natural feel.
        // Short replies (<40 chars expected): deliberate pace ~50ms/char = 20 c/s
        // Medium (40-160): natural typing      ~30ms/char = 33 c/s
        // Long (>=160): brisk reading pace     ~18ms/char = 55 c/s
        const expectedTotal = renderedText.length + pendingChars.length;
        let delay;
        if (expectedTotal >= 160) delay = 18;
        else if (expectedTotal >= 40) delay = 30;
        else delay = 50;
        // Micro-jitter (±15%) so it doesn't feel like a metronome
        delay = delay * (0.85 + Math.random() * 0.3);
        // Slight pause after punctuation — adds rhythm
        const lastChar = renderedText[renderedText.length - 1];
        if (lastChar === "." || lastChar === "!" || lastChar === "?") delay += 120;
        else if (lastChar === ",") delay += 50;
        // Catch-up safety net — if backend is way ahead, drain a tiny bit faster
        // but NEVER skip chars / batch (keeps it natural)
        if (pendingChars.length > 200) delay = Math.max(10, delay * 0.55);
        const ch = pendingChars.shift();
        renderedText += ch;
        if (bubble) {
          bubble.textContent = renderedText;
          msgs.scrollTop = msgs.scrollHeight;
        }
        typingTimer = setTimeout(tick, delay);
      };
      typingTimer = setTimeout(tick, 50);
    };

    const reader = res.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buf = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const ev = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 2);
        if (!ev.startsWith("data:")) continue;
        let evt;
        try { evt = JSON.parse(ev.slice(5).trim()); } catch (_) { continue; }
        if (evt.type === "chunk") {
          if (!bubble) {
            typing.remove();
            row = document.createElement("div");
            row.className = "row bot";
            row.appendChild(miniAvatar());
            bubble = document.createElement("div");
            bubble.className = "msg bot";
            row.appendChild(bubble);
            msgs.appendChild(row);
          }
          accReply += evt.text;
          // Push chars into the typing queue (not directly into the DOM)
          for (const ch of evt.text) pendingChars.push(ch);
          startTypingTimer();
        } else if (evt.type === "done") {
          finalCards = evt.cards || [];
          finalFollow = evt.follow_up || null;
          if (!bubble) {
            // No chunks were emitted (happens on tiny replies) — just render
            typing.remove();
            botMsg(evt.reply || "…", [], []);
            streamDone = true;
          } else {
            // Ensure any divergence between streamed chars and final reply is reconciled
            const finalReply = evt.reply || accReply;
            // Push any remaining chars (in case JSON-final had escape divergence)
            for (let i = renderedText.length + pendingChars.length; i < finalReply.length; i++) {
              pendingChars.push(finalReply[i]);
            }
            streamDone = true;
            startTypingTimer();
          }
        } else if (evt.type === "error") {
          throw new Error(evt.error || "stream error");
        }
      }
    }

    // Wait until the typing queue drains before showing follow-up
    while (pendingChars.length > 0) await new Promise(r => setTimeout(r, 50));

    // Render follow-up + cards (typing dots between for natural feel)
    if (finalFollow || finalCards.length > 0) {
      const typing2 = document.createElement("div");
      typing2.className = "typing";
      typing2.innerHTML = "<span></span><span></span><span></span>";
      msgs.appendChild(typing2);
      msgs.scrollTop = msgs.scrollHeight;
      await new Promise(r => setTimeout(r, 600));
      typing2.remove();
      botMsg(finalFollow || "", [], finalCards, { continuation: true });
    }
  } catch (err) {
    // Fallback to non-streaming endpoint
    if (!streamed) {
      try {
        const j = await postWithRetry(API + "/webchat/" + TENANT + "/message", {
          channel: "webchat", external_user_id: UID, contact_name: NAME_V,
          text: text, agent_id: AGENT_ID || null,
        });
        typing.remove();
        botMsg(j.reply || "…", [], []);
        if (j.follow_up || (j.cards && j.cards.length > 0)) {
          const typing2 = document.createElement("div");
          typing2.className = "typing";
          typing2.innerHTML = "<span></span><span></span><span></span>";
          msgs.appendChild(typing2);
          msgs.scrollTop = msgs.scrollHeight;
          await new Promise(r => setTimeout(r, 900));
          typing2.remove();
          botMsg(j.follow_up || "", [], j.cards || [], { continuation: true });
        }
        return;
      } catch (_) { /* fall through to error message */ }
    }
    typing.remove();
    botMsg("⚠️ Problema de ligação. A tentar novamente assim que possível.", [], []);
    setTimeout(() => {
      if (navigator.onLine) send(text);
    }, 4000);
  }
}

// Reconnect listener: when network comes back, let the user know
window.addEventListener("online", () => {
  if (msgs.querySelector(".typing")) return;
  const hint = document.createElement("div");
  hint.className = "row bot";
  hint.appendChild(miniAvatar());
  const m = document.createElement("div");
  m.className = "msg";
  m.style.background = "#DCFCE7";
  m.style.border = "1px solid #86EFAC";
  m.style.color = "#166534";
  m.textContent = "Ligação reposta ✓";
  hint.appendChild(m);
  msgs.appendChild(hint);
  msgs.scrollTop = msgs.scrollHeight;
});

async function loadAgent() {
  const url = API + "/public/agent/" + TENANT + (AGENT_ID ? "?agent_id=" + AGENT_ID : "");
  let j = null;
  for (let i = 0; i < 3 && !j; i++) {
    try {
      const r = await fetch(url);
      if (r.ok) j = await r.json();
    } catch { /* retry */ }
    if (!j) await new Promise(r => setTimeout(r, 500 * (i + 1)));
  }
  if (!j) {
    avInnerEl.textContent = "A";
    botMsg("Olá! Estamos a ligar-nos ao servidor…", [], []);
    setTimeout(loadAgent, 5000);
    return;
  }
  agent = j;
  // Apply per-agent theme overrides (CSS variables) — supports .primary and .bot
  if (j.theme && typeof j.theme === "object") {
    const root = document.documentElement.style;
    if (j.theme.primary) root.setProperty("--brand", j.theme.primary);
    if (j.theme.primary_dark) root.setProperty("--brand-dark", j.theme.primary_dark);
    if (j.theme.primary_soft) root.setProperty("--brand-soft", j.theme.primary_soft);
    if (j.theme.primary_border) root.setProperty("--brand-border", j.theme.primary_border);
    if (j.theme.bot) root.setProperty("--bot", j.theme.bot);
  }
  nameEl.textContent = j.name || "Assistente";
  document.title = (j.name || "Chat") + " · " + (j.tenant_name || "Consenso+");
  if (j.avatar_url) {
    avInnerEl.innerHTML = "";
    const img = document.createElement("img");
    img.src = j.avatar_url;
    img.onerror = () => { avInnerEl.textContent = initials(j.name); };
    avInnerEl.appendChild(img);
  } else {
    avInnerEl.textContent = initials(j.name);
  }
  botMsg(j.welcome_message || "Olá! Como posso ajudar?", j.icebreakers || [], []);
}

f.addEventListener("submit", e => {
  e.preventDefault();

loadAgent();

// Close button — posts message to parent or goes back
document.getElementById("closeBtn").addEventListener("click", () => {
  try {
    if (window.parent !== window) window.parent.postMessage({ type: "cp-close" }, "*");
    else window.history.length > 1 ? window.history.back() : window.close();
  } catch (e) { /* ignore */ }
});

// iOS visual viewport — adjust for keyboard so the input stays visible
if (window.visualViewport) {
  const root = document.documentElement;
  const adjust = () => {
    root.style.setProperty("--vv-h", window.visualViewport.height + "px");
    msgs.scrollTop = msgs.scrollHeight;
  };
  window.visualViewport.addEventListener("resize", adjust);
  window.visualViewport.addEventListener("scroll", adjust);
}
